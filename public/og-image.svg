    <text x="30" y="74" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#64748B">Practical IT Experience</text>
  </g>

  <g transform="translate(340, 460)">
    <rect width="220" height="90" rx="16" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <text x="30" y="50" font-family="system-ui, sans-serif" font-weight="700" font-size="32" fill="#F8FAFC">250+ Students</text>
    <text x="30" y="74" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#64748B">Taught at IlmHub</text>
