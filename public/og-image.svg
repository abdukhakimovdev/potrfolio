<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="180" r="320" fill="#2563EB" opacity="0.12" filter="blur(80px)" />
  <circle cx="150" cy="500" r="280" fill="#38BDF8" opacity="0.08" filter="blur(70px)" />

  <!-- Monogram Box -->
  <rect x="100" y="100" width="88" height="88" rx="20" fill="#1E293B" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
  <text x="144" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" fill="url(#accent)">AZ</text>

  <!-- Title & Subtitle -->
  <text x="100" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#F8FAFC" letter-spacing="-1">ABDUHAKIMOV AZIZBEK</text>
  <text x="100" y="330" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="url(#accent)" letter-spacing="1">IT MENTOR · DEVELOPER · TECHNOLOGY CREATOR</text>

  <text x="100" y="390" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
